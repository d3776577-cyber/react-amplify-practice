
name: Run Python Lambda Code

on:
  push:
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-24.04

    steps:
      - name: Get source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Lambda function
        run: python lambda_function.py
