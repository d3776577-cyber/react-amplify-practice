
name: Run Python Lambda Practice

on:
  push:
  workflow_dispatch:

jobs:
  run-lambda:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Lambda function
        run: python lambda_function.py
