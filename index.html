
<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Lambda Practice</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f0f4f8;
            padding: 60px 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 450px;
            margin: auto;
            box-shadow: 0 4px 12px #ccc;
        }
        button {
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        pre {
            text-align: left;
            background: #eee;
            padding: 15px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>AWS Lambda Practice</h1>
        <p>Python бағдарламасының нәтижесі</p>
        <button onclick="showResult()">Кодты іске қосу</button>
        <pre id="result">Нәтижені көру үшін батырманы басыңыз.</pre>
    </div>

    <script>
        function showResult() {
            document.getElementById("result").textContent =
`=== AWS Lambda жауабы ===
Status Code: 200
Message: Salem, Student!
Service: AWS Lambda
Status: Success`;
        }
    </script>
</body>
</html>
